<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --ink: #161b22;
    --sub: #46515c;
    --muted: #697783;
    --line: #d9e0e7;
    --paper: #f5f7f9;
    --panel: #ffffff;
    --soft: #eef3f6;
    --accent: #0f766e;
    --accent-2: #2563eb;
    --accent-3: #b45309;
    --accent-soft: #e4f3f0;
    --blue-soft: #e8f0ff;
    --amber-soft: #fff2dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.72;
  }
  a { color: inherit; }
  .site-header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 18px; }
  .nav {
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }
  .brand {
    text-decoration: none;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0;
  }
  .nav-links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 14px;
    color: var(--sub);
  }
  .nav-links a { text-decoration: none; }
  main.wrap { padding-top: 24px; padding-bottom: 38px; }
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(300px, 0.92fr);
    gap: 18px;
    align-items: stretch;
    margin-bottom: 18px;
  }
  .hero-copy {
    padding: 24px 0;
  }
  .eyebrow {
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    margin: 0 0 8px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 34px;
    line-height: 1.22;
    letter-spacing: 0;
  }
  .lead {
    color: var(--sub);
    max-width: 760px;
    margin: 0;
  }
  .top-pick {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .top-pick a { text-decoration: none; display: grid; grid-template-rows: 190px 1fr; height: 100%; }
  .top-image { display: grid; place-items: center; background: #fff; border-bottom: 1px solid var(--line); padding: 16px; }
  .top-image img { width: 100%; max-height: 150px; object-fit: contain; }
  .top-body { padding: 16px; }
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 14px;
    margin: 24px 0 12px;
  }
  h2 {
    margin: 0;
    font-size: 22px;
    line-height: 1.35;
    letter-spacing: 0;
  }
  h3 {
    margin: 24px 0 10px;
    font-size: 18px;
    letter-spacing: 0;
  }
  .small { color: var(--muted); font-size: 13px; margin: 0; }
  .notice {
    margin: 14px 0;
    padding: 10px 12px;
    background: var(--accent-soft);
    color: #115e59;
    border: 1px solid #bddbd5;
    border-radius: 8px;
    font-size: 14px;
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin: 18px 0;
  }
  .metric {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }
  .metric b { display: block; font-size: 22px; line-height: 1.2; }
  .metric span { color: var(--muted); font-size: 12px; }
  .category-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .category-pill {
    flex: 0 0 auto;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    text-decoration: none;
    color: var(--sub);
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    min-width: 0;
  }
  .card a { color: inherit; text-decoration: none; }
  .thumb {
    height: 186px;
    display: grid;
    place-items: center;
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px;
  }
  .thumb img { max-width: 100%; max-height: 160px; object-fit: contain; }
  .card-body { padding: 14px; }
  .card h3 {
    margin: 0 0 8px;
    font-size: 17px;
    line-height: 1.45;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 8px 0;
    color: var(--muted);
    font-size: 12px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid #bddbd5;
  }
  .badge.blue { background: var(--blue-soft); color: var(--accent-2); border-color: #c8d7ff; }
  .badge.amber { background: var(--amber-soft); color: var(--accent-3); border-color: #f1d2a7; }
  .post-layout {
    display: grid;
    grid-template-columns: minmax(260px, 380px) minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }
  .product-rail {
    position: sticky;
    top: 84px;
  }
  .product-image {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 12px;
  }
  .product-image img { width: 100%; max-height: 380px; object-fit: contain; display: block; }
  .product-facts {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
  }
  .article {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
  }
  .article h1 { font-size: 30px; margin-bottom: 10px; }
  .button {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 9px 15px;
    background: var(--accent);
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 800;
  }
  .outline-link {
    display: inline-flex;
    min-height: 36px;
    align-items: center;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    text-decoration: none;
    color: var(--sub);
    background: var(--panel);
  }
  .social-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .info-block {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }
  .article p, .article li, .card p { color: var(--sub); }
  ul { padding-left: 20px; }
  footer {
    border-top: 1px solid var(--line);
    color: var(--muted);
    background: var(--panel);
    padding: 20px 0;
  }
  @media (max-width: 980px) {
    .article .two-col { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .hero, .post-layout, .two-col { grid-template-columns: 1fr; }
    .product-rail { position: static; }
    .product-image img { max-height: 240px; }
    h1, .article h1 { font-size: 26px; }
    .nav { align-items: flex-start; flex-direction: column; padding: 12px 0; }
  }
